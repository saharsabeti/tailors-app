name: Web checks
on:
  push:
    branches: [main, feat/universal-react-native-web]
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run check:shared
      - run: npm run test:domain
      - run: npm run typecheck
      - run: npm run build:web

  android-debug:
    name: Android debug APK (no Expo)
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install JS dependencies
        run: npm install --no-audit --no-fund
      - name: Configure Android public API URL
        env:
          TAILORS_API_URL: ${{ vars.TAILORS_API_URL }}
        run: node scripts/configure-android-api.mjs
      - name: Bootstrap native Android folder
        run: npm run bootstrap:android
      - name: Verify native project files
        run: test -f android/gradlew && test -f android/settings.gradle && test -f android/app/build.gradle
      - name: Assemble debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Assemble standalone testing APK (bundled JS)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Verify standalone APK contains bundled JavaScript
        run: |
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          unzip -l "$APK" | grep -q 'assets/index.android.bundle'
      - name: Upload standalone test APK (debug-key signed; not production)
        uses: actions/upload-artifact@v4
        with:
          name: tailors-standalone-test-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tailors-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
